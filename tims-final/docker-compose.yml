version: "3.9"
services:
  mysql:
    image: mysql:8.0
    container_name: tims_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: tims_db
      MYSQL_USER: tims_user
      MYSQL_PASSWORD: tims_pass
    ports:
      - "3306:3306"
    volumes:
      - tims_mysql_data:/var/lib/mysql
      - ./01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost","-utims_user","-ptims_pass"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: tims_backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_USERNAME: tims_user
      DB_PASSWORD: tims_pass
      JWT_SECRET: tims-production-secret-key-min-32-chars-change-this!!
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/tims_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      RAW_STORAGE_PATH: /data/tims/raw
    ports:
      - "8080:8080"
    volumes:
      - tims_raw_data:/data/tims/raw
    restart: on-failure

volumes:
  tims_mysql_data:
  tims_raw_data:
